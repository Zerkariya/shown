    var cv = h("canvas", { role: "img", "aria-label": title });
    var ch = h("div", { class: "crosshair" }), br = h("div", { class: "brush" });
    holder.appendChild(cv); holder.appendChild(ch); holder.appendChild(br);
    wrap.appendChild(holder);
    container.appendChild(wrap);
    var ctx = setupCanvas(cv, W, height);
    var tr = { cv: cv, ctx: ctx, ch: ch, br: br, h: height, hover: hover };
    // draw() paints its y axis first, then calls clip() so data stays inside the plot area
    ctx.save();
    draw(ctx, height, function () { ctx.beginPath(); ctx.rect(ML, 0, xs.pw, height); ctx.clip(); });
    ctx.restore();
    drawChromGuides(ctx, xs, 0, height, false);
    tracks.push(tr);
    return tr;
  }
  function yAxis(ctx, height, lo, hi, ticks, fmt, pad) {
    pad = pad || 6;
    var Y = function (v) { return pad + (hi - v) / (hi - lo) * (height - 2 * pad); };
    ctx.font = "11px " + COLORS.font; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ticks.forEach(function (tv) {
      var y = Math.round(Y(tv)) + 0.5;
      ctx.strokeStyle = COLORS.grid; ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(W - MR, y); ctx.stroke();
      ctx.fillStyle = COLORS.muted; ctx.fillText(fmt ? fmt(tv) : String(tv), ML - 6, y);
    });
    return Y;
  }
  function inView(g) { return g >= region[0] && g <= region[1]; }
  function drawPoints(ctx, arr, Y, lo, hi, color) {
    if (!B || !arr) return;
    ctx.fillStyle = color;
    var lo0 = nearestIdx(B.g, region[0]), hi0 = nearestIdx(B.g, region[1]);
    var dense = (hi0 - lo0) > 6000;
    var sz = dense ? 1.4 : 2.2;
    for (var i = 0; i < B.n; i++) {
      var v = arr[i];
      if (v == null || !inView(B.g[i])) continue;
      var vv = v < lo ? lo : v > hi ? hi : v;
      ctx.fillRect(xs.x(B.g[i]) - sz / 2, Y(vv) - sz / 2, sz, sz);
    }
  }
  function segLine(ctx, gs, ge, y, color, thick) {
    var xa = xs.x(gs), xb = xs.x(ge);
    if (xb < ML || xa > W - MR) return;
    ctx.fillStyle = color;
    ctx.fillRect(xa, y - thick / 2, Math.max(1, xb - xa), thick);
  }

  // 1. ASCAT profile
  if (S) {
    var raw = PV.mode === "raw" && S.allele && S.hasRaw;
    var leg = S.allele ? (raw ? [{ label: t("total_raw"), color: COLORS["ascat-total"] }, { label: t("minor_raw"), color: COLORS["ascat-rawminor"] }]
      : [{ label: t("major"), color: COLORS["ascat-major"] }, { label: t("minor"), color: COLORS["ascat-minor"] }])
      : [{ label: t("total"), color: COLORS["ascat-total"] }];
    addTrack(t("track_profile"), leg, 170, function (ctx, height, clip) {
      var Y = yAxis(ctx, height, -0.25, ylim + 0.35, niceTicks(0, ylim, ylim), null, 4);
      clip();
      var thick = Math.max(3, Math.abs(Y(0) - Y(0.14)));
      S.raw.forEach(function (s, i) {
        var a, b, ca, cb;
        if (S.allele && !raw) { a = s[3] - 0.1; b = s[4] + 0.1; ca = COLORS["ascat-major"]; cb = COLORS["ascat-minor"];
          if (s[3] > ylim) a = ylim + 0.1; if (s[4] > ylim) b = ylim + 0.1; }
        else if (S.allele && raw) {
          a = s[8] != null ? s[8] : (s[5] != null && s[6] != null ? s[5] + s[6] : segTotal(s)); b = s[6] != null ? s[6] : s[4];
          ca = COLORS["ascat-total"]; cb = COLORS["ascat-rawminor"];
          if (a > ylim) a = ylim + 0.1; if (b > ylim) b = ylim + 0.1;
        } else { a = segTotal(s); b = null; ca = COLORS["ascat-total"]; if (a > ylim) a = ylim + 0.1; }
        if (a != null) { ctx.globalAlpha = a > ylim ? 0.6 : 1; segLine(ctx, S.gs[i], S.ge[i], Y(a), ca, thick); }
        if (b != null) { ctx.globalAlpha = b > ylim ? 0.6 : 1; segLine(ctx, S.gs[i], S.ge[i], Y(b), cb, thick); }
        ctx.globalAlpha = 1;
      });
    });
  }
  // 2. Delly read-depth copy number
  var hasCnBins = B && B.cn;
  if (hasCnBins || cnvCalls.length) {
    var maxCn = 4;
    if (hasCnBins) for (var i = 0; i < B.n; i++) if (B.cn[i] != null && B.cn[i] > maxCn) maxCn = B.cn[i];
    var cnTop = Math.min(12, Math.ceil(maxCn + 0.5));
    var leg2 = [];
    if (hasCnBins) leg2.push({ label: t("cn_points"), color: COLORS["delly-point"], shape: "dot" });
    leg2.push({ label: t("segments"), color: COLORS["delly-seg"], shape: "line" });
    addTrack(t("track_rd"), leg2, 150, function (ctx, height, clip) {
      var Y = yAxis(ctx, height, 0, cnTop, niceTicks(0, cnTop, 6), null, 6);
      clip();
      if (hasCnBins) drawPoints(ctx, B.cn, Y, 0, cnTop, COLORS["delly-point"]);
      var med = hasCnBins ? segMedians(p.id, "cn") : null;
      if (S) S.raw.forEach(function (s, i) {
        var v = med ? med[i] : (s[8] != null ? s[8] : segTotal(s));
        if (v != null) segLine(ctx, S.gs[i], S.ge[i], Y(Math.min(cnTop, v)), COLORS["delly-seg"], 2);
      });
      cnvCalls.forEach(function (r) { segLine(ctx, gpos(r[1], r[2]), gpos(r[1], r[3]), Y(Math.min(cnTop, r[15])), COLORS["delly-seg"], 3); });
    });
  }
  // 3. LogR
  if ((B && B.logr) || (S && S.hasLogr)) {
    var leg3 = [];
    if (B && B.logr) leg3.push({ label: t("raw_points"), color: COLORS["ascat-point"], shape: "dot" });
    var logrMed = S && !S.hasLogr && B && B.logr ? segMedians(p.id, "logr") : null;
    if ((S && S.hasLogr) || logrMed) leg3.push({ label: t("seg_logr"), color: COLORS["ascat-seg"], shape: "line" });
    addTrack(t("track_logr"), leg3, 130, function (ctx, height, clip) {
      var Y = yAxis(ctx, height, -2, 2, [-2, -1, 0, 1, 2], null, 6);
      clip();
      drawPoints(ctx, B && B.logr, Y, -2, 2, COLORS["ascat-point"]);
      if (S && (S.hasLogr || logrMed)) S.raw.forEach(function (s, i) {
        var v = S.hasLogr ? s[9] : logrMed[i];
        if (v != null) segLine(ctx, S.gs[i], S.ge[i], Y(Math.max(-2, Math.min(2, v))), COLORS["ascat-seg"], 2);
      });
    });
  }
  // 4. BAF
  var fitBaf = S && S.allele && p.purity != null;
  if ((B && B.baf) || (S && S.raw.some(function (s) { return s[10] != null; }))) {
    var leg4 = [];
    if (B && B.baf) leg4.push({ label: t("raw_points"), color: COLORS["ascat-point"], shape: "dot" });
    if (fitBaf) leg4.push({ label: t("fitted_baf"), color: COLORS["ascat-seg"], shape: "line" });
    addTrack(t("track_baf"), leg4, 120, function (ctx, height, clip) {
      var Y = yAxis(ctx, height, 0, 1, [0, 0.5, 1], function (v) { return fmtNum(v, 1); }, 6);
      clip();
      drawPoints(ctx, B && B.baf, Y, 0, 1, COLORS["ascat-point"]);
      if (S) S.raw.forEach(function (s, i) {
        var bv = null;
        if (fitBaf && s[3] + s[4] > 0) { var rho = Math.min(1, p.purity); bv = (1 - rho + rho * s[4]) / (2 - 2 * rho + rho * (s[3] + s[4])); }
        else if (s[10] != null) bv = s[10];
        if (bv == null) return;
        segLine(ctx, S.gs[i], S.ge[i], Y(bv), COLORS["ascat-seg"], 2);
        segLine(ctx, S.gs[i], S.ge[i], Y(1 - bv), COLORS["ascat-seg"], 2);
      });
    });
  }
  // 5. SV arcs
  var svVis = [];
  if (svIdx.length) {
    var typesHere = SV_PRESENT.filter(function (ty) { return svRows.some(function (r) { return r[6] === ty; }); });
    addTrack(t("track_sv"), typesHere.map(function (ty) { return { label: SV_NAMES[ty], color: svColor(ty), shape: "line" }; }), 120, function (ctx, height, clip) {
      clip();
      var baseY = height - 6;
      ctx.strokeStyle = COLORS.axis; ctx.beginPath(); ctx.moveTo(ML, baseY + 0.5); ctx.lineTo(W - MR, baseY + 0.5); ctx.stroke();
      ctx.lineWidth = 1.5;
      svRows.forEach(function (r) {
        var g1 = gpos(r[1], r[2]);
        var g2 = r[4] != null && r[4] !== r[1] ? gpos(r[4], r[5] || 0) : r[3] != null ? gpos(r[1], r[3]) : null;
        var col = svColor(r[6]);
        var x1 = xs.x(g1), in1 = inView(g1);
        if (r[6] === "INS" || g2 == null) {
          if (!in1) return;
          ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x1, baseY - 10); ctx.lineTo(x1 - 4, baseY - 2); ctx.lineTo(x1 + 4, baseY - 2); ctx.closePath(); ctx.fill();
          svVis.push({ r: r, xs: [x1] });
          return;
        }
        var x2 = xs.x(g2), in2 = inView(g2);
        if (!in1 && !in2) return;
        var size = Math.abs(g2 - g1);
        var hgt = r[4] != null && r[4] !== r[1] ? (height - 16) : Math.max(8, Math.min(height - 16, (Math.log10(Math.max(10, size)) - 1) / 8 * (height - 16)));
        ctx.strokeStyle = col; ctx.globalAlpha = 0.85;
        if (in1 && in2) {
          ctx.beginPath(); ctx.moveTo(x1, baseY); ctx.quadraticCurveTo((x1 + x2) / 2, baseY - 2 * hgt, x2, baseY); ctx.stroke();
          if (Math.abs(x2 - x1) < 2) { ctx.beginPath(); ctx.moveTo(x1, baseY); ctx.lineTo(x1, baseY - hgt * 0.5); ctx.stroke(); }
        } else {
          var xi = in1 ? x1 : x2;
          ctx.beginPath(); ctx.moveTo(xi, baseY); ctx.lineTo(xi, baseY - hgt * 0.7); ctx.stroke();
          ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xi, baseY - hgt * 0.7, 3, 0, 2 * Math.PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
        svVis.push({ r: r, xs: [in1 ? x1 : null, in2 ? x2 : null] });
      });
      ctx.lineWidth = 1;
    });
  }

  // shared crosshair + tooltip + brush zoom
  function tipAt(x) {
    var g = xs.inv(x), rows = [];
    if (S) {
      var si = segAt(S, g);
      if (si >= 0) {
        var s = S.raw[si];
        if (s[3] != null && s[4] != null) rows.push({ k: "nMajor + nMinor", v: s[3] + " + " + s[4], color: COLORS["ascat-major"] });
        if (s[5] != null && s[6] != null) rows.push({ k: "nAraw + nBraw", v: fmtNum(s[5], 2) + " + " + fmtNum(s[6], 2), color: COLORS["ascat-total"] });
        else if (s[8] != null) rows.push({ k: t("total_raw"), v: fmtNum(s[8], 2), color: COLORS["ascat-total"] });
        if (s[3] == null) rows.push({ k: t("total"), v: fmtNum(segTotal(s), 2), color: COLORS["ascat-total"] });
        var st = cnState(segTotal(s), baseFor(base, s[0], p));
        if (st != null) rows.push({ k: t("state"), v: t(STATE_KEYS[st]), color: stateColor(st) });
        if (s[9] != null) rows.push({ k: t("seg_logr"), v: fmtNum(s[9], 3), color: COLORS["ascat-seg"] });
        rows.push({ k: t("segment"), v: chrLabel(s[0]) + ":" + fmtInt(s[1]) + "–" + fmtInt(s[2]) + " (" + fmtBp(s[2] - s[1] + 1) + ")" });
      }
    }
    if (B) {
      var bi = nearestIdx(B.g, g);
      if (bi >= 0 && Math.abs(xs.x(B.g[bi]) - x) <= 4) {
        if (B.logr && B.logr[bi] != null) rows.push({ k: "LogR", v: fmtNum(B.logr[bi], 3), color: COLORS["ascat-point"] });
        if (B.baf && B.baf[bi] != null) rows.push({ k: "BAF", v: fmtNum(B.baf[bi], 3), color: COLORS["ascat-point"] });
        if (B.cn && B.cn[bi] != null) rows.push({ k: "CN", v: fmtNum(B.cn[bi], 2), color: COLORS["delly-point"] });
      }
    }
    var near = svVis.filter(function (o) { return o.xs.some(function (xx) { return xx != null && Math.abs(xx - x) <= 5; }); }).slice(0, 4);
    near.forEach(function (o) {
      var r = o.r;
      var where = r[4] != null && r[4] !== r[1] ? chrLabel(r[1]) + ":" + fmtInt(r[2]) + " ↔ " + chrLabel(r[4]) + ":" + fmtInt(r[5]) : fmtBp(r[7]);
      rows.push({ k: SV_NAMES[r[6]] + (r[13] ? " " + r[13] : ""), v: where + (r[9] && HAS_PASS && String(r[9]).toUpperCase() !== "PASS" ? " · " + r[9] : ""), color: svColor(r[6]) });
    });
    return { title: fmtLocus(g), rows: rows };
  }
  var drag = null;
  tracks.forEach(function (tr) {
    var cv = tr.cv;
    cv.addEventListener("pointermove", function (e) {
      var r = cv.getBoundingClientRect(), x = e.clientX - r.left;
      if (drag) {
        var a = Math.max(ML, Math.min(drag.x0, x)), b = Math.min(W - MR, Math.max(drag.x0, x));
        tracks.forEach(function (o) { o.br.style.display = "block"; o.br.style.left = a + "px"; o.br.style.width = (b - a) + "px"; });
      }
      if (x < ML || x > W - MR) { hideTip(); tracks.forEach(function (o) { o.ch.style.display = "none"; }); return; }
      tracks.forEach(function (o) { o.ch.style.display = "block"; o.ch.style.left = x + "px"; });
      var tp = tipAt(x);
      showTip(e.clientX, e.clientY, tp.title, tp.rows);
    });
    cv.addEventListener("pointerleave", function () { if (!drag) { hideTip(); tracks.forEach(function (o) { o.ch.style.display = "none"; }); } });
    cv.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "touch") return;
      var r = cv.getBoundingClientRect();
      drag = { x0: e.clientX - r.left };
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    cv.addEventListener("pointerup", function (e) {
      if (!drag) return;
      var r = cv.getBoundingClientRect(), x = e.clientX - r.left;
      var a = Math.max(ML, Math.min(drag.x0, x)), b = Math.min(W - MR, Math.max(drag.x0, x));
      drag = null;
      tracks.forEach(function (o) { o.br.style.display = "none"; });
      if (b - a > 6) {
        var ga = Math.max(0, xs.inv(a)), gb = Math.min(GLEN, xs.inv(b));
        if (gb - ga > 1e4) { hideTip(); setRegion([ga, gb]); }
      }
    });
    cv.addEventListener("dblclick", function () {
      var ci = chromAt(region[0]);
      var isChrom = region[0] === OFF[ci] && region[1] === OFF[ci] + CH[ci].len;
      setRegion(isChrom || region[1] - region[0] >= GLEN * 0.999 ? null : [OFF[ci], OFF[ci] + CH[ci].len]);
    });
  });
}

/* --------------------------- data & mapping ---------------------------- */
function renderData(root) {
  clear(root);
  var sc = card(t("sources"));
  var cols = [
    { label: t("file"), get: function (s) { return s.file; } },
    { label: t("sheet"), get: function (s) { return s.sheet; } },
    { label: t("kind"), get: function (s) { return t("kind_" + s.kind); } },
    { label: t("header_row"), num: true, get: function (s) { return s.header_row; } },
    { label: t("rows"), num: true, get: function (s) { return s.rows; }, fmt: fmtInt },
    { label: t("filtered"), num: true, get: function (s) { return s.filtered_out || null; }, fmt: fmtInt },
    { label: t("mapping"), get: function (s) { return Object.keys(s.mapping).map(function (k) { return k + " ← " + s.mapping[k]; }).join(", "); } },
    { label: t("unused"), get: function (s) { return s.unused_columns.length ? s.unused_columns.join(", ") : null; } }
  ];
  sc.appendChild(dataTable({ columns: cols, rows: D.meta.sources }));
  root.appendChild(sc);

  var wc = card(t("warnings"));
  if (D.meta.warnings.length) wc.appendChild(h("ul", { class: "warnlist" }, D.meta.warnings.map(function (w) { return h("li", { text: w }); })));
  else wc.appendChild(h("p", { class: "hint", text: t("no_warnings") }));
  root.appendChild(wc);

  if (ATTR.length) {
    var ac = card(t("attr_list"));
    ac.appendChild(dataTable({ columns: [
      { label: t("field"), get: function (a) { return a.key; } },
      { label: t("label"), get: function (a) { return lbl(a); } },
      { label: t("type"), get: function (a) { return a.type; } },
      { label: "order", get: function (a) { return a.order ? a.order.join(" < ") : null; } }
    ], rows: ATTR }));
    root.appendChild(ac);
  }

  var dc = card(t("definitions"));
  var dl = h("dl", { class: "defs" });
  [["purity", t("purity")], ["ploidy", t("ploidy")], ["wgd", "WGD"], ["gi", "GI"], ["loh", "LOH"], ["fga", "FGA"], ["state", t("state")], ["colors", LANG === "en" ? "Colours" : "颜色"]].forEach(function (kv) {
    dl.appendChild(h("dt", { text: kv[1] })); dl.appendChild(h("dd", { text: t("def_" + kv[0]) }));
  });
  dc.appendChild(dl);
  root.appendChild(dc);

  var mc = card(t("raw_mapping"));
  mc.appendChild(h("pre", { class: "json", text: JSON.stringify(D.meta.mapping, null, 2) }));
  root.appendChild(mc);
}

/* ======================================================================= *
 * boot
 * ======================================================================= */
var langBtn = document.getElementById("lang-btn");
function applyLang() {
  setLocale();
  document.getElementById("title").textContent = loc(D.meta, "title");
  document.getElementById("subtitle").textContent = loc(D.meta, "subtitle") || "";
  document.title = loc(D.meta, "title");
  langBtn.textContent = t("other_lang");
  langBtn.setAttribute("aria-label", t("lang_aria"));
  themeBtn.textContent = t("theme_" + THEME);
  Array.prototype.forEach.call(tabsEl.querySelectorAll(".tab"), function (b) { b.textContent = t(b.getAttribute("data-key")); });
  document.getElementById("metaline").textContent = [t("generated") + " " + D.meta.generated, t("genome") + " " + D.meta.genome,
    fmtInt(P.length) + " " + t("patients")].join(" · ");
}
langBtn.addEventListener("click", function () {
  LANG = LANG === "en" ? "zh" : "en";
  store("shown-lang", LANG);
  applyLang();
  invalidateAll();
});
applyLang();
applyTheme();
readRoute();
lastWidth = document.getElementById("main").clientWidth;
function routeTab() { return ROUTE.tab && VIEWS.some(function (v) { return v.id === ROUTE.tab && v.show; }) ? ROUTE.tab : "overview"; }
window.addEventListener("hashchange", function () {
  var before = ROUTE.id;
  ROUTE = {}; readRoute();
  if (ROUTE.id !== before) PV.region = null;
  DIRTY.patient = true;
  go(routeTab());
});
go(routeTab());
})();
</script>
