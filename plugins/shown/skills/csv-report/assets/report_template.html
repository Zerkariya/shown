      showTip(e.clientX, e.clientY, tp.title, tp.rows);
    });
    cv.addEventListener("pointerleave", function () { if (!drag) { hideTip(); tracks.forEach(function (o) { o.ch.style.display = "none"; }); } });
    cv.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "touch") return;
      var r = cv.getBoundingClientRect();
      drag = { x0: e.clientX - r.left };
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    cv.addEventListener("pointerup", function (e) {
      if (!drag) return;
      var r = cv.getBoundingClientRect(), x = e.clientX - r.left;
      var a = Math.max(ML, Math.min(drag.x0, x)), b = Math.min(W - MR, Math.max(drag.x0, x));
      drag = null;
      tracks.forEach(function (o) { o.br.style.display = "none"; });
      if (b - a > 6) {
        var ga = Math.max(0, xs.inv(a)), gb = Math.min(GLEN, xs.inv(b));
        if (gb - ga > 1e4) { hideTip(); setRegion([ga, gb]); }
      }
    });
    cv.addEventListener("dblclick", function () {
      var ci = chromAt(region[0]);
      var isChrom = region[0] === OFF[ci] && region[1] === OFF[ci] + CH[ci].len;
      setRegion(isChrom || region[1] - region[0] >= GLEN * 0.999 ? null : [OFF[ci], OFF[ci] + CH[ci].len]);
    });
  });
}

/* --------------------------- data & mapping ---------------------------- */
function renderData(root) {
  clear(root);
  var sc = card(t("sources"));
  var cols = [
    { label: t("file"), get: function (s) { return s.file; } },
    { label: t("sheet"), get: function (s) { return s.sheet; } },
    { label: t("kind"), get: function (s) { return t("kind_" + s.kind); } },
    { label: t("header_row"), num: true, get: function (s) { return s.header_row; } },
    { label: t("rows"), num: true, get: function (s) { return s.rows; }, fmt: fmtInt },
    { label: t("filtered"), num: true, get: function (s) { return s.filtered_out || null; }, fmt: fmtInt },
    { label: t("mapping"), get: function (s) { return Object.keys(s.mapping).map(function (k) { return k + " ← " + s.mapping[k]; }).join(", "); } },
    { label: t("unused"), get: function (s) { return s.unused_columns.length ? s.unused_columns.join(", ") : null; } }
  ];
  sc.appendChild(dataTable({ columns: cols, rows: D.meta.sources }));
  root.appendChild(sc);

  var wc = card(t("warnings"));
  if (D.meta.warnings.length) wc.appendChild(h("ul", { class: "warnlist" }, D.meta.warnings.map(function (w) { return h("li", { text: w }); })));
  else wc.appendChild(h("p", { class: "hint", text: t("no_warnings") }));
  root.appendChild(wc);

  if (ATTR.length) {
    var ac = card(t("attr_list"));
    ac.appendChild(dataTable({ columns: [
      { label: t("field"), get: function (a) { return a.key; } },
      { label: t("label"), get: function (a) { return lbl(a); } },
      { label: t("type"), get: function (a) { return a.type; } },
      { label: "order", get: function (a) { return a.order ? a.order.join(" < ") : null; } }
    ], rows: ATTR }));
    root.appendChild(ac);
  }

  var dc = card(t("definitions"));
  var dl = h("dl", { class: "defs" });
  [["purity", t("purity")], ["ploidy", t("ploidy")], ["wgd", "WGD"], ["gi", "GI"], ["loh", "LOH"], ["fga", "FGA"], ["state", t("state")], ["colors", LANG === "en" ? "Colours" : "颜色"]].forEach(function (kv) {
    dl.appendChild(h("dt", { text: kv[1] })); dl.appendChild(h("dd", { text: t("def_" + kv[0]) }));
  });
  dc.appendChild(dl);
  root.appendChild(dc);

  var mc = card(t("raw_mapping"));
  mc.appendChild(h("pre", { class: "json", text: JSON.stringify(D.meta.mapping, null, 2) }));
  root.appendChild(mc);
}

 * boot

var langBtn = document.getElementById("lang-btn");
function applyLang() {
  setLocale();
  document.getElementById("title").textContent = loc(D.meta, "title");
  document.getElementById("subtitle").textContent = loc(D.meta, "subtitle") || "";
  document.title = loc(D.meta, "title");
  langBtn.textContent = t("other_lang");
  langBtn.setAttribute("aria-label", t("lang_aria"));
  themeBtn.textContent = t("theme_" + THEME);
  Array.prototype.forEach.call(tabsEl.querySelectorAll(".tab"), function (b) { b.textContent = t(b.getAttribute("data-key")); });
  document.getElementById("metaline").textContent = [t("generated") + " " + D.meta.generated,
    HAS_GENOMIC && D.meta.genome ? t("genome") + " " + D.meta.genome : null,
    fmtInt(P.length) + " " + t("patients")].filter(Boolean).join(" · ");
}
langBtn.addEventListener("click", function () {
  LANG = LANG === "en" ? "zh" : "en";
  store("shown-lang", LANG);
  applyLang();
  invalidateAll();
});
applyLang();
applyTheme();
readRoute();
lastWidth = document.getElementById("main").clientWidth;
function routeTab() { return ROUTE.tab && VIEWS.some(function (v) { return v.id === ROUTE.tab && v.show; }) ? ROUTE.tab : "overview"; }
window.addEventListener("hashchange", function () {
  var before = ROUTE.id;
  ROUTE = {}; readRoute();
  if (ROUTE.id !== before) PV.region = null;
  DIRTY.patient = true;
  go(routeTab());
});
go(routeTab());
})();
</script>
